[package]
name = "web-transport-noq"
description = "WebTransport library for Noq (a Quinn fork)"
authors = ["Luke Curley"]
repository = "https://github.com/moq-dev/web-transport"
license = "MIT OR Apache-2.0"

version = "0.4.5"
edition = "2021"

keywords = ["quic", "http3", "webtransport"]
categories = ["network-programming", "web-programming"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["aws-lc-rs"]
aws-lc-rs = ["noq/aws-lc-rs", "rustls/aws-lc-rs"]
ring = ["noq/ring", "rustls/ring"]
# Unlocks `noq::TransportConfig::qlog_*`, which this crate re-exports but cannot
# enable on a caller's behalf.
qlog = ["noq/qlog"]

[dependencies]
bytes = "1"
futures = "0.3"
http = "1"
kio = "0.6.2"
noq = { version = "1", default-features = false, features = [
    "tracing-log",
    "runtime-tokio",
    "rustls",
    "bloom",
] }
rustls = { version = "0.23", default-features = false, features = [
    "logging",
    "std",
] }
rustls-platform-verifier = "0.7"
socket2 = "0.6"
thiserror = "2"
tokio = { version = "1", default-features = false, features = [
    "io-util",
    "macros",
    "time",
] }
tracing = "0.1"
url = "2"
web-transport-proto = { workspace = true }
web-transport-trait = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
# Must be the `jni` version rustls-platform-verifier uses, so both see one VM
# singleton; see `src/android.rs`.
jni = { version = "0.22", default-features = false }

[dev-dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rcgen = "0.14"
rustls-pemfile = "2"
tokio = { version = "1", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
