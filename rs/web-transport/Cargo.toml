[package]
name = "web-transport"
description = "Generic WebTransport API with native (web-transport-quinn) and WASM (web-transport-wasm) support."
authors = ["Luke Curley"]
repository = "https://github.com/moq-dev/web-transport"
license = "MIT OR Apache-2.0"

version = "0.13.9"
edition = "2021"

keywords = ["quic", "http3", "webtransport"]
categories = ["network-programming", "web-programming"]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bytes = "1"
thiserror = "2"
url = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
web-transport-quinn = { version = "0.13.6", path = "../web-transport-quinn" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-transport-wasm = { version = "0.8.8", path = "../web-transport-wasm" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
anyhow = "1"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["macros", "rt", "time"] }
