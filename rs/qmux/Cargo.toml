[package]
name = "qmux"
description = "QMux protocol (draft-ietf-quic-qmux-02) over reliable transports"
authors = ["Luke Curley"]
repository = "https://github.com/moq-dev/web-transport"
license = "MIT OR Apache-2.0"

version = "0.6.6"
edition = "2021"
rust-version = "1.90"

keywords = ["quic", "qmux", "webtransport", "multiplexing"]
categories = ["network-programming"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["tls", "wss"]
tcp = ["tokio/net", "tokio/io-util"]
uds = ["tokio/net", "tokio/io-util"]
tls = ["tcp", "dep:tokio-rustls", "dep:rustls"]
ws = ["dep:tokio-tungstenite", "dep:futures"]
wss = [
    "ws",
    "dep:rind-rustls",
    "dep:rustls",
    "dep:rustls-native-certs",
    "tokio-tungstenite/rustls-tls-native-roots",
]

[dependencies]
bytes = "1"
futures = { version = "0.3", optional = true }
rind-rustls = { version = "0.23", optional = true }
rustls = { version = "0.23", default-features = false, features = ["logging", "std", "tls12"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
thiserror = "2"
tokio = { version = "1.27", features = ["sync", "time", "macros", "rt"] }

# Optional: TLS
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12"], optional = true }

# Optional: WebSocket
tokio-tungstenite = { version = "0.30", optional = true }
tracing = "0.1"
web-transport-proto = { workspace = true }
web-transport-trait = { workspace = true }

# TCP_INFO / TCP_CONNECTION_INFO for `SocketStats`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
anyhow = "1"
rcgen = "0.14"
rind-rustls = "0.23"
tokio = { version = "1.27", features = ["full", "test-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
url = "2"
web-transport-proto = { workspace = true }
web-transport-trait = { workspace = true }

[[bench]]
name = "credit"
harness = false
required-features = ["tcp"]

[[example]]
name = "h3qx"
required-features = ["tcp"]

[[example]]
name = "interop-server"
required-features = ["ws"]
