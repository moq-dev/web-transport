[package]
name = "web-transport-iroh"
description = "WebTransport library for Iroh"
authors = ["Franz Heinzmann <frando@n0.computer>"]
repository = "https://github.com/moq-dev/web-transport"
license = "MIT OR Apache-2.0"
version = "0.8.4"
edition = "2024"

keywords = ["quic", "http3", "webtransport", "iroh"]
categories = ["network-programming", "web-programming"]

[features]
default = ["metrics", "portmapper"]
metrics = ["iroh/metrics"]
portmapper = ["iroh/portmapper"]
qlog = ["iroh/qlog"]

[dependencies]
bytes = "1"
http = "1"
iroh = { version = "1.4", default-features = false, features = ["fast-apple-datapath"] }
kio = "0.6.2"
n0-error = "1"
n0-future = "0.3.1"
rind-rustls = "0.23"
rustls = { version = "0.23", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = [
    "io-util",
    "macros",
    "sync",
] }
tracing = "0.1.41"
url = "2"
web-transport-proto = { workspace = true }
web-transport-trait = { workspace = true }

[dev-dependencies]
n0-tracing-test = "0.3.0"
tokio = { version = "1", features = ["full"] }
