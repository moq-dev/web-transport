name: CI
permissions:
  contents: read

on:
  pull_request:
    branches: ["main"]
  # Main's runs seed the Rust caches: a pull request can restore its base
  # branch's caches but never another pull request's.
  push:
    branches: ["main"]

# Cancel a superseded run so a newer push to the PR frees its runner. Main's
# runs finish, so a burst of merges still saves a cache.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  kotlin:
    name: Kotlin/JVM artifact
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: cachix/install-nix-action@v31.11.5
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/actions/setup-gradle@v6
      - uses: Swatinem/rust-cache@v2
        with:
          key: kotlin-jvm-${{ hashFiles('flake.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Exercise packaged Kotlin/JVM binding
        run: nix develop --command just test-kotlin
      - name: Upload JVM test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kotlin-jvm-test-results
          path: |
            kt/web-transport/build/reports/tests/jvmTest/
            kt/web-transport/build/test-results/jvmTest/
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    env:
      # Backtraces keep file:line, and the cache and test binaries shrink by
      # about 40% without full debuginfo.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only

    steps:
      - uses: actions/checkout@v7

      # Install Nix
      - uses: cachix/install-nix-action@v31.11.5
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2
        with:
          # The toolchain comes from the dev shell, which the runner's rustc in
          # the default key does not track.
          key: ${{ hashFiles('flake.lock') }}
          # Only main saves, so pull requests share one warm cache instead of
          # evicting it with their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Make sure u guys don't write bad code
      - run: nix develop --command just check
      - run: nix develop --command just test
      # `just test` regenerates the loader; it must match the committed copy.
      - run: git diff --exit-code -- js/web-transport/napi.cjs js/web-transport/napi.d.cts
