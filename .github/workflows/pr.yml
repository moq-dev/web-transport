name: CI
permissions:
  contents: read

on:
  pull_request:
    branches: ["main"]

# Cancel a superseded run so a newer push to the PR frees its runner.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  kotlin:
    name: Kotlin/JVM artifact
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: cachix/install-nix-action@v31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/actions/setup-gradle@v6
      - uses: Swatinem/rust-cache@v2
        with:
          key: kotlin-jvm
      - name: Exercise packaged Kotlin/JVM binding
        run: nix develop --command just test-kotlin
      - name: Upload JVM test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kotlin-jvm-test-results
          path: |
            kt/web-transport/build/reports/tests/jvmTest/
            kt/web-transport/build/test-results/jvmTest/
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Install Nix
      - uses: cachix/install-nix-action@v31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # Set RUSTFLAGS
      - run: echo "RUSTFLAGS=--cfg=web_sys_unstable_apis" >> $GITHUB_ENV

      # Make sure u guys don't write bad code
      - run: nix develop --command just check
      - run: nix develop --command just test
      # `just test` regenerates the loader; it must match the committed copy.
      - run: git diff --exit-code -- js/web-transport/napi.cjs js/web-transport/napi.d.cts
