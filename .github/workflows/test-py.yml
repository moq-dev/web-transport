name: Python runtime

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.11.2
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, install and test Python wheel with Chromium
        run: nix develop --command ./py/web-transport/test-wheel.sh --with-browser-deps
