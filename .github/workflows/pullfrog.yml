# PULLFROG ACTION - DO NOT EDIT EXCEPT WHERE INDICATED
name: Pullfrog
run-name: ${{ inputs.name || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      prompt:
        type: string
        description: Agent prompt
      name:
        type: string
        description: Run name

permissions:
  contents: read

jobs:
  pullfrog:
    runs-on: ubuntu-latest
    # Only main may deploy to this environment, so a dispatch on a pushed
    # branch can't mint the OIDC token Pullfrog trades for model access.
    environment: pullfrog
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      # Edited: what the review needs to run the repository's checks and
      # tests. The environment admits only main, so the dev shell comes from
      # the default branch, not a pull request's head.
      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f # main
        with:
          determinate: false
      - name: Put the dev shell's tools on PATH
        # bash, not the default shell, for pipefail: a failing print-dev-env
        # must fail the step, not write an empty PATH.
        shell: bash
        run: |
          nix print-dev-env --json |
            jq -r '.variables.PATH.value' |
            tr ':' '\n' | grep '^/nix/store/' | paste -sd: >>"$GITHUB_PATH"
      # The installer wrote the job's token into world-readable nix.conf and
      # nix.custom.conf, and into /nix/receipt.json's plan, where the agent's
      # shell could read it.
      - name: Remove the job token from Nix's config
        env:
          TOKEN: ${{ github.token }}
        run: |
          sudo find /etc/nix -type f -exec sed -i '/^access-tokens/d' {} +
          sudo chmod 0600 /nix/receipt.json
          if sudo grep -rqF "$TOKEN" /etc/nix; then
            echo "the job token is still under /etc/nix" >&2
            exit 1
          fi
      - name: Run agent
        uses: pullfrog/pullfrog@0741f79ecebfa4469a010644d2aed2d96d32d489 # v0.1.127
        with:
          prompt: ${{ inputs.prompt }}
        # No provider keys from this repository: model access is configured
        # in the Pullfrog console (https://docs.pullfrog.com/model-access).
